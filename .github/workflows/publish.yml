name: Publish to npm

on:
  push:
    branches: [master]
    paths: [package.json]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Check if version changed
        id: version-check
        run: |
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          # Ask for this exact version rather than comparing against `latest`:
          # a pre-release never becomes `latest`, so that comparison would
          # try to publish it again on every later package.json change.
          PUBLISHED=$(npm view "$PACKAGE_NAME@$LOCAL_VERSION" version 2>/dev/null || true)
          echo "Local: $LOCAL_VERSION / Already published: ${PUBLISHED:-no}"
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          if [ -z "$PUBLISHED" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          # A pre-release (e.g. 5.8.0-beta.1) goes to the `beta` dist-tag so
          # users only get it by asking for it; `latest` stays on the stable.
          if [[ "$LOCAL_VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version-check.outputs.changed == 'true'
        run: |
          if [ "${{ steps.version-check.outputs.prerelease }}" = "true" ]; then
            npm publish --tag beta
          else
            npm publish
          fi

      - name: Extract changelog section
        if: steps.version-check.outputs.changed == 'true'
        id: changelog
        run: |
          VERSION="${{ steps.version-check.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 == "## " ver { flag=1; next }
            /^## / { flag=0 }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        if: steps.version-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version-check.outputs.version }}"
          PRERELEASE_FLAG=""
          if [ "${{ steps.version-check.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG
